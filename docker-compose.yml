services:
  wiremock:
    image: wiremock/wiremock:3x
    ports:
      - "8780:8080"
    volumes:
      - ./etc/wiremock:/home/wiremock/mappings
    command: --verbose --disable-http2-plain

  algashop-postgres:
    image: postgres:17-alpine
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - algashop-postgres:/var/lib/postgresql/data
      - ./etc/postgres/init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4:latest
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "8090:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@algashop.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - algashop-pgadmin:/var/lib/pgadmin
    depends_on:
      algashop-postgres:
        condition: service_healthy

volumes:
  algashop-postgres:
  algashop-pgadmin: