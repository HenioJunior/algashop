
collection:
  post:
    tags:
      - Orders
    description: Create an Order
    requestBody:
      required: true
      content:
        application/vnd.order-with-shopping-cart.v1+json:
          schema:
            $ref: ../schemas/order.yaml#/OrderWithShoppingCartInput
        application/vnd.order-with-product.v1+json:
          schema:
            $ref: ../schemas/order.yaml#/OrderWithProductInput
    responses:
      201:
        description: Order created
        content:
          application/json:
            schema:
              $ref: ../schemas/order.yaml#/Order
        headers:
          Location:
            description: Resource address
            schema:
              type: string
            example: '/api/v1/orders/01226N0693HDE'
      400:
        $ref: ../components/responses.yaml#/BadRequest
      409:
        $ref: ../components/responses.yaml#/Conflict
      422:
        $ref: ../components/responses.yaml#/UnprocessableEntity
      500:
        $ref: ../components/responses.yaml#/InternalError

  get:
    description: List orders
    tags:
      - Orders
    parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: ../schemas/order.yaml#/OrderStatus

      - name: placedAtFrom
        in: query
        required: false
        schema:
          type: string
          format: date
          example: '2024-04-01'

      - name: placedAtTo
        in: query
        required: false
        schema:
          type: string
          format: date
          example: '2024-04-25'

      - name: totalAmountFrom
        in: query
        required: false
        schema:
          type: number
          example: 1211.98

      - name: totalAmountTo
        in: query
        required: false
        schema:
          type: number
          example: 2341.98

      - $ref: ../components/parameters.yaml#/orderIdQuery

      - $ref: ../components/parameters.yaml#/customerIdQuery

      - $ref: ../components/parameters.yaml#/page
      - $ref: ../components/parameters.yaml#/size
      - $ref: ../components/parameters.yaml#/sort
      - $ref: ../components/parameters.yaml#/direction

    responses:
      200:
        description: Ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../schemas/common.yaml#/Page
                - type: object
                  properties:
                    content:
                      type: array
                      items:
                        $ref: ../schemas/order.yaml#/OrderSummary

resource1:
  parameters:
    - $ref: ../components/parameters.yaml#/orderId

  get:
    tags:
      - Orders
    description: Order detail
    responses:
      200:
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/order.yaml#/Order
      404:
        $ref: ../components/responses.yaml#/NotFound
