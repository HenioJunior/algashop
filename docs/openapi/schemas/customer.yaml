Customer:
  type: object
  required:
  - id
  - firstName
  - lastName
  - email
  - document
  - phone
  - birthDate
  - loyaltyPoints
  - registeredAt
  - archivedAt
  - promotionNotificationsAllowed
  - archived
  - address
  properties:
    id:
      type: string
      example: 01226N0640J7H
    firstName:
      type: string
      example: John
    lastName:
      type: string
      example: Doe
    email:
      type: string
      example: johndoe@email.com
    document:
      type: string
      example: '12345'
    phone:
      type: string
      example: '1191234564'
    birthDate:
      type: string
      format: date
      example: '1991-07-05'
    loyaltyPoints:
      type: number
      example: 10
    registeredAt:
      type: string
      format: date-time
      example: '2024-04-04T00:12:45Z'
    archivedAt:
      type: string
      format: date-time
      example: '2024-04-04T00:12:45Z'
    promotionNotificationsAllowed:
      type: boolean
      example: false
    archived:
      type: boolean
      example: false
    address:
      $ref: customer.yaml#/Address
Address:
  type: object
  required:
  - street
  - number
  - complement
  - neighborhood
  - city
  - state
  - zipCode
  properties:
    street:
      type: string
      example: Bourbon Street
      nullable: false
      x-validation: notBlank
    number:
      type: string
      example: '2000'
      nullable: false
      x-validation: notBlank
    complement:
      type: string
      example: apt 122
      nullable: true
    neighborhood:
      type: string
      example: North Ville
      nullable: false
      x-validation: notBlank
    city:
      type: string
      example: Yostfort
      nullable: false
      x-validation: notBlank
    state:
      type: string
      example: South Carolina
      nullable: false
      x-validation: notBlank
    zipCode:
      type: string
      example: '12321'
      nullable: false
      x-validation: notBlank
CustomerSummary:
  type: object
  required:
  - id
  - firstName
  - lastName
  - email
  - phone
  - archived
  properties:
    id:
      type: string
      example: 01226N0640J7H
    firstName:
      type: string
      example: John
    lastName:
      type: string
      example: Doe
    email:
      type: string
      example: johndoe@email.com
    phone:
      type: string
      example: '1191234564'
    archived:
      type: boolean
      example: false
CustomerInput:
  type: object
  required:
  - firstName
  - lastName
  - email
  - document
  - phone
  - birthDate
  - promotionNotificationsAllowed
  - address
  properties:
    firstName:
      type: string
      example: John
      nullable: false
      x-validation: notBlank
    lastName:
      type: string
      example: Doe
      nullable: false
      x-validation: notBlank
    email:
      type: string
      example: johndoe@email.com
      nullable: false
      x-validation:
      - email
      - notBlank
    document:
      type: string
      example: '12345'
      nullable: false
      x-validation: notBlank
    phone:
      type: string
      example: '1191234564'
      nullable: false
      x-validation: notBlank
    birthDate:
      type: string
      format: date
      example: '1991-07-05'
      nullable: false
      x-validation: pastDate
    promotionNotificationsAllowed:
      type: boolean
      example: false
    address:
      $ref: customer.yaml#/Address
CustomerUpdateInput:
  type: object
  required:
  - firstName
  - lastName
  - phone
  - promotionNotificationsAllowed
  - address
  properties:
    firstName:
      type: string
      example: John
      nullable: false
      x-validation: notBlank
    lastName:
      type: string
      example: Doe
      nullable: false
      x-validation: notBlank
    phone:
      type: string
      example: '1191234564'
      nullable: false
      x-validation: notBlank
    promotionNotificationsAllowed:
      type: boolean
      example: false
      nullable: false
    address:
      $ref: customer.yaml#/Address
