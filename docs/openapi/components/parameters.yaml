page:
  schema:
    type: integer
    example: 0
  name: page
  in: query
  required: false
size:
  schema:
    type: integer
    example: 5
  name: size
  in: query
  required: false
sort:
  name: sortByProperty
  in: query
  required: false
  schema:
    type: string
    enum:
      - REGISTERED_AT
      - FIRST_NAME
    default: REGISTERED_AT
    example: FIRST_NAME

direction:
  name: sortDirection
  in: query
  required: false
  schema:
    type: string
    enum:
      - ASC
      - DESC
    default: ASC
    example: DESC