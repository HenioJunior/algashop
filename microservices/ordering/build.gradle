plugins {
	id 'idea'
	id 'java'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.springframework.cloud.contract' version '5.0.3'
}

group = 'com.henio.algashop'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.1.0")
	set('springCloudContractVersion', '5.0.3')
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	mockitoAgent
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'com.fasterxml.uuid:java-uuid-generator:5.2.0'
	implementation 'io.hypersistence:hypersistence-tsid:2.1.4'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	runtimeOnly 'com.h2database:h2'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.assertj:assertj-core:3.27.7'
	// Spring Cloud Contract
	testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-verifier'
	// REST Assured
	testImplementation 'io.rest-assured:spring-mock-mvc'
	testImplementation platform('io.rest-assured:rest-assured-bom:6.1.0')
	testImplementation 'io.rest-assured:rest-assured'

	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	mockitoAgent('org.mockito:mockito-core:5.14.2') {transitive = false}
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}

	dependencies {
		dependencySet(group: 'org.springframework.cloud',
				version: springCloudContractVersion) {
			entry 'spring-cloud-starter-contract-verifier'
			entry 'spring-cloud-contract-verifier'
			entry 'spring-cloud-contract-spec'
			entry 'spring-cloud-contract-spec-java'
			entry 'spring-cloud-contract-spec-groovy'
			entry 'spring-cloud-contract-shade'
		}
	}
}

contracts {
	testFramework = 'JUNIT5'
	testMode = 'MockMvc'
	contractsDslDir = file('src/contractTest/resources/contracts')

	baseClassForTests =
			'com.henio.algashop.ordering.contract.base.OrderBase'
}

// Testes unitários e de controllers
tasks.named('test', Test) {
	useJUnitPlatform()

	filter {
		excludeTestsMatching('*IT')
	}

	jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
}

// Testes de integração
tasks.register('integrationTest', Test) {
	description = 'Run integration tests.'
	group = 'verification'

	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	shouldRunAfter tasks.named('test')

	useJUnitPlatform()

	jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"

	testLogging {
		events 'passed'
	}

	filter {
		includeTestsMatching '*IT'
	}
}

// Testes de contrato
tasks.named('contractTest', Test) {
	useJUnitPlatform()
}

// Verificação completa
tasks.named('check') {
	dependsOn(
			tasks.named('test'),
			tasks.named('integrationTest'),
			tasks.named('contractTest')
	)
}

sourceSets {
	openapi {
		java.srcDir 'src/openapi/java'
	}
}

dependencies {
	openapiImplementation 'io.swagger.parser.v3:swagger-parser:2.1.36'
}

tasks.register('bundleOpenApi', JavaExec) {
	group = 'documentation'
	description = 'Generate bundled OpenAPI specification'

	def openApiDirectory = file('../../docs/openapi')
	def outputFile = layout.buildDirectory.file(
			'generated/openapi/openapi-bundled.yaml'
	)

	dependsOn tasks.named('compileOpenapiJava')

	inputs.files(
			fileTree(openApiDirectory) {
				include '**/*.yaml'
				include '**/*.yml'
			}
	).withPathSensitivity(PathSensitivity.RELATIVE)

	outputs.file(outputFile)

	classpath = sourceSets.openapi.runtimeClasspath
	mainClass = 'BundleOpenApi'

	args(
			file("${openApiDirectory}/openapi.yaml").absolutePath,
			outputFile.get().asFile.absolutePath
	)
}

tasks.named('processResources', Copy) {
	dependsOn tasks.named('bundleOpenApi')

	from(layout.buildDirectory.file(
			'generated/openapi/openapi-bundled.yaml'
	)) {
		into 'static'
	}
}