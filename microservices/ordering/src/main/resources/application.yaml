spring:
  application:
    name: ordering
  datasource:
    url: 'jdbc:postgresql://localhost:5432/ordering'
    username: postgres
    password: 'postgres'

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: 'true'

algashop:
  integrations:
    shipping.provider: "RAPIDEX"
    rapidex.url: "http://localhost:8780"
    product-catalog.url: "http://localhost:8780"

springdoc:
  swagger-ui:
    url: /openapi-bundled.yaml
    disable-swagger-default-url: true

logging:
  level:
    com.henio.algashop.ordering.presentation.ApiExceptionHandler: DEBUG